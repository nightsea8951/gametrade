<script>
    function calculate() {
        const jpyInput = document.getElementById('jpyAmount');
        const jpy = parseFloat(jpyInput.value);
        const display = document.getElementById('twdDisplay');
        const resultArea = document.getElementById('result-area');

        if (isNaN(jpy) || jpy <= 0) {
            alert("請輸入有效的日幣金額");
            jpyInput.focus();
            return;
        }

        let twd = 0;
        if (jpy < 30000) {
            twd = (jpy / 5) * 1.28 + 30;
        } else if (jpy >= 30000 && jpy <= 50000) {
            twd = (jpy / 5) * 1.28;
        } else {
            let rawTwd = (jpy / 5) * 1.265;
            let remainder = rawTwd % 100;
            twd = remainder <= 50 ? Math.floor(rawTwd / 100) * 100 : Math.ceil(rawTwd / 100) * 100;
        }

        resultArea.style.display = 'block';
        
        animateValue(display, 0, Math.round(twd), 800);

        setTimeout(() => {
            resultArea.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }, 100);
    }

    function animateValue(obj, start, end, duration) {
        let startTimestamp = null;
        const step = (timestamp) => {
            if (!startTimestamp) startTimestamp = timestamp;
            const progress = Math.min((timestamp - startTimestamp) / duration, 1);
            obj.innerHTML = Math.floor(progress * (end - start) + start).toLocaleString();
            if (progress < 1) {
                window.requestAnimationFrame(step);
            }
        };
        window.requestAnimationFrame(step);
    }
</script>
